services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: ["sh", "-c", "DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"]
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    command: ["pnpm", "dev"]
    environment:
      BACKEND_ORIGIN: http://api:8001
      NEXT_PUBLIC_COMPANY_SLUG: ${NEXT_PUBLIC_COMPANY_SLUG:-sinov-qurilish}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  nginx:
    profiles: ["production"]

volumes:
  frontend_node_modules:
  frontend_next:
