services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: construction-crm:dev
    command: ["sh", "-c", "DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && DATABASE_URL=$$APP_DATABASE_URL exec uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts

  nginx:
    profiles: ["production"]
