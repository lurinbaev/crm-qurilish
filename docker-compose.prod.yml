# Server deployment stack. Published web port is loopback only for the VPS proxy.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
      - ./deploy/roles.sql:/docker-entrypoint-initdb.d/20-roles.sql.template:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${MIGRATION_DB_USER:?MIGRATION_DB_USER required}:${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD required}@db:5432/${POSTGRES_DB:?POSTGRES_DB required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?APP_DB_USER required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@db:5432/${POSTGRES_DB:?POSTGRES_DB required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ENVIRONMENT: production
    expose: ["8001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 768m

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_ORIGIN: http://api:8001
        NEXT_PUBLIC_COMPANY_SLUG: ${NEXT_PUBLIC_COMPANY_SLUG:?Set real public company slug}
    environment:
      BACKEND_ORIGIN: http://api:8001
      NEXT_PUBLIC_COMPANY_SLUG: ${NEXT_PUBLIC_COMPANY_SLUG:?Set real public company slug}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set by sdp port-suggest}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

volumes:
  pgdata:
