services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_course_v3}
      POSTGRES_USER: ${POSTGRES_USER:-crm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-${POSTGRES_USER:-crm_owner}}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      APP_DB_USER: ${APP_DB_USER:-${POSTGRES_USER:-crm_owner}}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
      - ./deploy/roles.sql:/docker-entrypoint-initdb.d/20-roles.sql.template:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    image: ${APP_IMAGE:-construction-crm:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${MIGRATION_DB_USER:-${POSTGRES_USER:-crm_owner}}:${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@db:5432/${POSTGRES_DB:-crm_course_v3}
      APP_DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-${POSTGRES_USER:-crm_owner}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@db:5432/${POSTGRES_DB:-crm_course_v3}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-${POSTGRES_USER:-crm_owner}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@db:5432/${POSTGRES_DB:-crm_course_v3}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: ["sh", "-c", "DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && DATABASE_URL=$$APP_DATABASE_URL exec uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
